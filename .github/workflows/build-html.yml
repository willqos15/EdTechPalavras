name: Build HTML único

run-name: Build HTML ${{ inputs.generation_id }}

on:
  workflow_dispatch:
    inputs:
      generation_id:
        description: "Identificador único da geração"
        required: true
        type: string
      payload:
        description: "JSON do conteúdo educacional"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar JSON e preparar data.ts
        env:
          CONTENT_JSON: ${{ inputs.payload }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const raw = process.env.CONTENT_JSON;

          if (!raw) {
            throw new Error('O conteúdo JSON não foi informado.');
          }

          let parsed;

          try {
            parsed = JSON.parse(raw);
          } catch {
            throw new Error(
              'O conteúdo enviado não é um JSON válido.'
            );
          }

          const lessons = Array.isArray(parsed)
            ? parsed
            : Array.isArray(parsed.data)
              ? parsed.data
              : [parsed];

          const client = typeof parsed.client === 'string' && parsed.client.trim()
            ? parsed.client.trim()
            : '';

          if (!lessons.length) {
            throw new Error('O JSON não contém conteúdo.');
          }

          for (const lesson of lessons) {
            if (
              !lesson ||
              typeof lesson.titulo !== 'string' ||
              !Array.isArray(lesson.frases)
            ) {
              throw new Error(
                'Cada conteúdo precisa de titulo e frases[].'
              );
            }

            for (const frase of lesson.frases) {
              if (
                !frase ||
                typeof frase.palavra !== 'string' ||
                typeof frase.dica !== 'string'
              ) {
                throw new Error(
                  'Cada frase precisa de palavra e dica.'
                );
              }
            }
          }

          const safeLessons = lessons.map((lesson) => ({
            titulo: lesson.titulo,

            ...(typeof lesson.imghome === 'string' &&
            lesson.imghome.trim()
              ? { imghome: lesson.imghome }
              : {}),

            frases: lesson.frases.map((frase) => ({
              palavra: frase.palavra,
              dica: frase.dica,

              ...(typeof frase.imagem === 'string' &&
              frase.imagem.trim()
                ? { imagem: frase.imagem }
                : {}),

              ...(typeof frase.tema === 'string'
                ? { tema: frase.tema }
                : {})
            }))
          }));

          const generated = `import img from "./image.png";

          export const image = img;

          export const client = ${JSON.stringify(client)};

          type Tfrases = {
            palavra: string;
            dica: string;
            imagem?: string;
            tema?: string;
          };

          type Tdata = {
            titulo: string;
            frases: Tfrases[];
            imghome?: string;
          };

          export const data: Tdata[] = ${JSON.stringify(
            safeLessons,
            null,
            2
          )};
          `;

          fs.writeFileSync(
            'src/page/data/data.ts',
            generated,
            'utf8'
          );

          console.log(
            `Conteúdos preparados: ${lessons.length}`
          );
          NODE

      - name: Executar build
        run: npm run build

      - name: Validar HTML único
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dir = 'dist';

          if (!fs.existsSync(dir)) {
            throw new Error('A pasta dist não foi criada.');
          }

          const files = fs.readdirSync(dir)
            .filter((name) => name.endsWith('.html'));

          if (files.length !== 1) {
            throw new Error(
              `Esperado 1 HTML em dist; encontrados ${files.length}.`
            );
          }

          const html = fs.readFileSync(
            path.join(dir, files[0]),
            'utf8'
          );

          if (!html.includes('<html')) {
            throw new Error(
              'O arquivo gerado não parece HTML.'
            );
          }

          console.log(`HTML gerado: ${files[0]}`);
          NODE

      - name: Disponibilizar HTML
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ inputs.generation_id }}
          path: dist/*.html
          if-no-files-found: error
          retention-days: 1

        
      - name: Instalar Nodemailer para envio
        run: npm install --prefix /tmp/edtech-mail nodemailer

      - name: Enviar arquivos por e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          GENERATION_ID: ${{ inputs.generation_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const nodemailer = require(
            '/tmp/edtech-mail/node_modules/nodemailer'
          );

          async function main() {
            const {
              GMAIL_USER,
              GMAIL_APP_PASSWORD,
              EMAIL_DESTINO,
              GENERATION_ID
            } = process.env;

            if (
              !GMAIL_USER ||
              !GMAIL_APP_PASSWORD ||
              !EMAIL_DESTINO
            ) {
              throw new Error(
                'Configure GMAIL_USER, GMAIL_APP_PASSWORD e EMAIL_DESTINO nos Secrets.'
              );
            }

            const htmlFiles = fs.readdirSync('dist')
              .filter((name) => name.endsWith('.html'));

            if (htmlFiles.length !== 1) {
              throw new Error(
                'Era esperado exatamente um arquivo HTML.'
              );
            }

            const htmlPath = path.join('dist', htmlFiles[0]);
            const dataPath = 'src/page/data/data.ts';

            if (!fs.existsSync(dataPath)) {
              throw new Error('O arquivo data.ts não foi encontrado.');
            }

            const transporter = nodemailer.createTransport({
              service: 'gmail',
              auth: {
                user: GMAIL_USER,
                pass: GMAIL_APP_PASSWORD
              }
            });

            await transporter.sendMail({
              from: GMAIL_USER,
              to: EMAIL_DESTINO,
              subject: `EdTechPalavras - Build ${GENERATION_ID}`,
              text: [
                'Uma nova geração do EdTechPalavras foi concluída.',
                '',
                `Identificador: ${GENERATION_ID}`,
                '',
                `Client: ${client}`,
                '',
                'Arquivos anexados: HTML offline e data.ts.'
              ].join('\n'),
              attachments: [
                {
                  filename: htmlFiles[0],
                  path: htmlPath
                },
                {
                  filename: 'data.ts',
                  path: dataPath
                }
              ]
            });

            console.log('Arquivos enviados por e-mail com sucesso.');
          }

          main().catch((error) => {
            console.error('Falha no envio do e-mail:', error.message);
            process.exitCode = 1;
          });
          NODE
